    <!-- TEORÍA: definición y gráfico -->
    <ion-card>
        <ion-card-header>
          <ion-card-title>Triángulo</ion-card-title>
          <ion-card-subtitle>Perímetro</ion-card-subtitle>
        </ion-card-header>

        <ion-card-content>
          El perímetro de un triángulo es la suma de las longitudes de sus tres
          lados. En otra palabras, es la medida total del contorno o borde del
          triángulo.
          <ion-img
            class="imagen-triangulo"
            src="assets/images/triangulo.svg"
            alt="perimetro_triangulo"
          ></ion-img>
        </ion-card-content>
      </ion-card>


      <!-- ENTRADA: ngModel enlaza cada lado; al escribir se borra el resultado -->
      <form>
        <ion-list class="ion-no-margin ion-no-padding">
          <ion-item>
            <ion-input label="Lado A (cm)" labelPlacement="stacked" type="number"
              name="ladoA" [(ngModel)]="ladoA" (ionInput)="limpiarResultado()"></ion-input>
          </ion-item>
          <ion-item>
            <ion-input label="Lado B (cm)" labelPlacement="stacked" type="number"
              name="ladoB" [(ngModel)]="ladoB" (ionInput)="limpiarResultado()"></ion-input>
          </ion-item>
          <ion-item>
            <ion-input label="Lado C (cm)" labelPlacement="stacked" type="number"
              name="ladoC" [(ngModel)]="ladoC" (ionInput)="limpiarResultado()"></ion-input>
          </ion-item>
        </ion-list>
      </form>



      <!-- BOTÓN Y RESULTADO -->
      <ion-list lines="none" class="ion-no-margin ion-no-padding">
        <ion-item>
          <ion-button (click)="onCalcularPerimetro()">CALCULAR PERÍMETRO</ion-button>
        </ion-item>

        <!-- resultado: solo si ya se calculó -->
        <ion-item *ngIf="perimetroTriangulo !== null">
          <ion-text>El perímetro es: {{ perimetroTriangulo }} cm</ion-text>
        </ion-item>

        <!-- error: solo si la validación falló -->
        <ion-item *ngIf="mensajeError">
          <ion-text color="danger">{{ mensajeError }}</ion-text>
        </ion-item>
      </ion-list>
